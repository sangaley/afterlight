[package]
name = "afterlight"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", features = ["dynamic_linking", "mp3"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.11"

# Optimize for fast compile times during development
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Optimize for performance in release
[profile.release]
lto = true
codegen-units = 1
